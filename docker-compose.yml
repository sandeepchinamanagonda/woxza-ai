services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voxa}
      POSTGRES_USER: ${POSTGRES_USER:-voxa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxa_local_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxa} -d ${POSTGRES_DB:-voxa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [voxa]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8787}:8787"
    environment:
      PORT: 8787
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-voxa}
      PGUSER: ${POSTGRES_USER:-voxa}
      PGPASSWORD: ${POSTGRES_PASSWORD:-voxa_local_password}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3456}
      DB_CONNECT_RETRIES: 30
      REDIS_URL: redis://redis:6379
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8787}
      WEBSITE_URL: ${WEBSITE_URL:-http://localhost}
      PLIVO_AUTH_ID: ${PLIVO_AUTH_ID:-}
      PLIVO_AUTH_TOKEN: ${PLIVO_AUTH_TOKEN:-}
      PLIVO_FROM_NUMBER: ${PLIVO_FROM_NUMBER:-}
      PLIVO_STREAM_CONTENT_TYPE: ${PLIVO_STREAM_CONTENT_TYPE:-audio/x-l16;rate=16000}
      PLIVO_L16_BYTE_ORDER: ${PLIVO_L16_BYTE_ORDER:-little}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-2.5-flash-native-audio-preview-12-2025}
      GEMINI_DEMO_VOICE: ${GEMINI_DEMO_VOICE:-Kore}
      VOICE_PIPELINE: ${VOICE_PIPELINE:-v1}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_STT_MODEL: ${SARVAM_STT_MODEL:-saaras:v4}
      V2_STT_MODE: ${V2_STT_MODE:-codemix}
      V2_STT_LANGUAGE_CODE: ${V2_STT_LANGUAGE_CODE:-unknown}
      SARVAM_TTS_MODEL: ${SARVAM_TTS_MODEL:-bulbul:v3}
      SARVAM_TTS_SPEAKER: ${SARVAM_TTS_SPEAKER:-ritu}
      SARVAM_TTS_SPEAKER_TE: ${SARVAM_TTS_SPEAKER_TE:-}
      SARVAM_TTS_PRONUNCIATION_DICT_ID: ${SARVAM_TTS_PRONUNCIATION_DICT_ID:-}
      SARVAM_TTS_PACE: ${SARVAM_TTS_PACE:-1.15}
      SARVAM_TTS_TEMPERATURE: ${SARVAM_TTS_TEMPERATURE:-0.70}
      SARVAM_TTS_SPEAKER_ORDER_AS: ${SARVAM_TTS_SPEAKER_ORDER_AS:-}
      SARVAM_TTS_SPEAKER_ORDER_BN: ${SARVAM_TTS_SPEAKER_ORDER_BN:-}
      SARVAM_TTS_SPEAKER_ORDER_EN: ${SARVAM_TTS_SPEAKER_ORDER_EN:-}
      SARVAM_TTS_SPEAKER_ORDER_GU: ${SARVAM_TTS_SPEAKER_ORDER_GU:-}
      SARVAM_TTS_SPEAKER_ORDER_HI: ${SARVAM_TTS_SPEAKER_ORDER_HI:-}
      SARVAM_TTS_SPEAKER_ORDER_KN: ${SARVAM_TTS_SPEAKER_ORDER_KN:-}
      SARVAM_TTS_SPEAKER_ORDER_ML: ${SARVAM_TTS_SPEAKER_ORDER_ML:-}
      SARVAM_TTS_SPEAKER_ORDER_MR: ${SARVAM_TTS_SPEAKER_ORDER_MR:-}
      SARVAM_TTS_SPEAKER_ORDER_PA: ${SARVAM_TTS_SPEAKER_ORDER_PA:-}
      SARVAM_TTS_SPEAKER_ORDER_TA: ${SARVAM_TTS_SPEAKER_ORDER_TA:-}
      SARVAM_TTS_SPEAKER_ORDER_TE: ${SARVAM_TTS_SPEAKER_ORDER_TE:-}
      SARVAM_TTS_SPEAKER_ORDER_UR: ${SARVAM_TTS_SPEAKER_ORDER_UR:-}
      SARVAM_TTS_PACE_TE: ${SARVAM_TTS_PACE_TE:-}
      SARVAM_TTS_TEMPERATURE_TE: ${SARVAM_TTS_TEMPERATURE_TE:-}
      VOICE_COST_ESTIMATION_VERSION: ${VOICE_COST_ESTIMATION_VERSION:-sarvam-2026-09}
      VOICE_COST_SARVAM_TTS_INR_PER_1K_CHARS: ${VOICE_COST_SARVAM_TTS_INR_PER_1K_CHARS:-3}
      VOICE_COST_SARVAM_STT_V3_INR_PER_MIN: ${VOICE_COST_SARVAM_STT_V3_INR_PER_MIN:-0.30}
      VOICE_COST_SARVAM_STT_V4_INR_PER_MIN: ${VOICE_COST_SARVAM_STT_V4_INR_PER_MIN:-0.50}
      VOICE_COST_SARVAM_105B_INPUT_INR_PER_MILLION: ${VOICE_COST_SARVAM_105B_INPUT_INR_PER_MILLION:-29.28}
      VOICE_COST_SARVAM_105B_CACHED_INPUT_INR_PER_MILLION: ${VOICE_COST_SARVAM_105B_CACHED_INPUT_INR_PER_MILLION:-10.98}
      VOICE_COST_SARVAM_105B_OUTPUT_INR_PER_MILLION: ${VOICE_COST_SARVAM_105B_OUTPUT_INR_PER_MILLION:-73.20}
      V2_TTS_CODEC: ${V2_TTS_CODEC:-linear16}
      V2_TTS_SAMPLE_RATE: ${V2_TTS_SAMPLE_RATE:-16000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-}
      V2_BRAIN_PROVIDER: ${V2_BRAIN_PROVIDER:-openrouter}
      SARVAM_CHAT_MODEL: ${SARVAM_CHAT_MODEL:-sarvam-105b-conversations}
      VOICE_RESPONSE_MAX_TOKENS: ${VOICE_RESPONSE_MAX_TOKENS:-56}
      VOICE_RESPONSE_MAX_TOKENS_TE: ${VOICE_RESPONSE_MAX_TOKENS_TE:-120}
      VOICE_REPAIR_MAX_TOKENS: ${VOICE_REPAIR_MAX_TOKENS:-72}
      VOICE_REPAIR_MAX_TOKENS_TE: ${VOICE_REPAIR_MAX_TOKENS_TE:-112}
      V2_TTS_PROVIDER: ${V2_TTS_PROVIDER:-fish}
      FISH_TTS_MODEL: ${FISH_TTS_MODEL:-fish-audio/s2.1-pro-free:free}
      V2_TTS_FALLBACK: ${V2_TTS_FALLBACK:-sarvam}
      V2_END_SILENCE_MS: ${V2_END_SILENCE_MS:-750}
      V2_LLM_TIMEOUT_MS: ${V2_LLM_TIMEOUT_MS:-3000}
      V2_RESPONSE_STREAMING: ${V2_RESPONSE_STREAMING:-false}
      V2_TTS_PHRASE_MIN_CHARS: ${V2_TTS_PHRASE_MIN_CHARS:-18}
      V3_STT_MODEL: ${V3_STT_MODEL:-saaras:v3-realtime}
      V3_STT_MODE: ${V3_STT_MODE:-codemix}
      V3_STT_STREAM_TYPE: ${V3_STT_STREAM_TYPE:-fast}
      V3_STT_SILENCE_MS: ${V3_STT_SILENCE_MS:-500}
      V3_LATENCY_CHERRY_VAD_MS: ${V3_LATENCY_CHERRY_VAD_MS:-}
      V3_STT_MIN_SPEECH_MS: ${V3_STT_MIN_SPEECH_MS:-250}
      V3_TURN_CONTROL: ${V3_TURN_CONTROL:-provider}
      V3_TURN_START_FRAMES: ${V3_TURN_START_FRAMES:-2}
      V3_TURN_ENDPOINT_SILENCE_MS: ${V3_TURN_ENDPOINT_SILENCE_MS:-750}
      V3_TURN_PRE_ROLL_FRAMES: ${V3_TURN_PRE_ROLL_FRAMES:-10}
      # Keep the caller's UI-selected language unless the controller confirms a change.
      V3_LANGUAGE_SWITCH_POLICY: ${V3_LANGUAGE_SWITCH_POLICY:-locked}
      SPEAK_FIRST: ${SPEAK_FIRST:-true}
      SPEAK_FIRST_TIMEOUT_ENABLED: ${SPEAK_FIRST_TIMEOUT_ENABLED:-true}
      SPEAK_FIRST_TIMEOUT_SECONDS: ${SPEAK_FIRST_TIMEOUT_SECONDS:-6}
      V3_WOXZA_PHRASE_MIN_CHARS: ${V3_WOXZA_PHRASE_MIN_CHARS:-}
      V3_WOXZA_PHRASE_MAX_CHARS: ${V3_WOXZA_PHRASE_MAX_CHARS:-}
      V3_WOXZA_PHRASE_MAX_WAIT_MS: ${V3_WOXZA_PHRASE_MAX_WAIT_MS:-}
      V3_SARVAM_TTS_MIN_BUFFER_CHARS: ${V3_SARVAM_TTS_MIN_BUFFER_CHARS:-}
      V3_TTS_MIN_BUFFER_CHARS: ${V3_TTS_MIN_BUFFER_CHARS:-60}
      V3_TTS_MAX_CHUNK_CHARS: ${V3_TTS_MAX_CHUNK_CHARS:-200}
      V3_TTS_CHUNKER: ${V3_TTS_CHUNKER:-legacy}
      V3_TTS_DELIVERY_MODE: ${V3_TTS_DELIVERY_MODE:-turn}
      # Select `indic` for the local AI4Bharat FastPitch/HiFi-GAN A/B test.
      # Keep Sarvam as the safe default; it is also the automatic fallback.
      V3_TTS_PROVIDER: ${V3_TTS_PROVIDER:-sarvam}
      V3_TTS_FALLBACK: ${V3_TTS_FALLBACK:-sarvam}
      INDIC_TTS_URL: ${INDIC_TTS_URL:-http://host.docker.internal:5050}
      INDIC_TTS_SPEAKER: ${INDIC_TTS_SPEAKER:-female}
      INDIC_TTS_SPEAKER_TE: ${INDIC_TTS_SPEAKER_TE:-female}
      V3_TTS_PHRASE_MIN_CHARS: ${V3_TTS_PHRASE_MIN_CHARS:-}
      V3_TTS_PHRASE_MAX_CHARS: ${V3_TTS_PHRASE_MAX_CHARS:-140}
      V3_TTS_PHRASE_MAX_WAIT_MS: ${V3_TTS_PHRASE_MAX_WAIT_MS:-0}
      V3_PHONE_REPLY_MAX_CHARS: ${V3_PHONE_REPLY_MAX_CHARS:-180}
      V3_BRAIN_PROVIDER: ${V3_BRAIN_PROVIDER:-sarvam}
      V3_GEMINI_MODEL: ${V3_GEMINI_MODEL:-gemini-2.5-flash}
      V3_GEMINI_INPUT_USD_PER_MILLION: ${V3_GEMINI_INPUT_USD_PER_MILLION:-0.30}
      V3_GEMINI_CACHED_INPUT_USD_PER_MILLION: ${V3_GEMINI_CACHED_INPUT_USD_PER_MILLION:-0.03}
      V3_GEMINI_OUTPUT_USD_PER_MILLION: ${V3_GEMINI_OUTPUT_USD_PER_MILLION:-2.50}
      VOICE_COST_USD_TO_INR: ${VOICE_COST_USD_TO_INR:-94.50}
      V3_OPENAI_MODEL: ${V3_OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      V3_ANTHROPIC_MODEL: ${V3_ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEMO_TEST_PHONE: ${DEMO_TEST_PHONE:-}
      LOCAL_ADMIN_MODE: ${LOCAL_ADMIN_MODE:-false}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-development-only-admin-session-secret-change-me}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEMO_EMAIL_FROM: ${DEMO_EMAIL_FROM:-Woxza <demo@example.com>}
      UNSUBSCRIBE_SIGNING_SECRET: ${UNSUBSCRIBE_SIGNING_SECRET:-development-only-change-me}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [voxa]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [voxa]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_LOCAL_ADMIN_MODE: ${VITE_LOCAL_ADMIN_MODE:-false}
        VITE_LOCAL_ADMIN_TOKEN: ${VITE_LOCAL_ADMIN_TOKEN:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3456}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [voxa]

volumes:
  postgres_data:
  redis_data:

networks:
  voxa:
