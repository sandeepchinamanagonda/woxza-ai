name: Authorize Woxza production administrator

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm that this laptop should receive production SSH access'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  authorize:
    name: Add dedicated laptop SSH key
    if: ${{ inputs.confirm }}
    runs-on: [self-hosted, Linux, ARM64]
    environment:
      name: production
    steps:
      - name: Authorize the known laptop key
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_user='ubuntu'
          public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE02lVx1Fu3T59XccT70gXLeefQX6H5YTDfAEVUqgygW woxza-production-admin-2026-09'

          if [[ "$(id -un)" != "$expected_user" ]]; then
            echo "Refusing: GitHub runner user is $(id -un), expected ${expected_user}."
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"

          if grep -qxF "$public_key" "$HOME/.ssh/authorized_keys"; then
            echo 'SSH key is already authorized.'
          else
            printf '%s\n' "$public_key" >> "$HOME/.ssh/authorized_keys"
            echo 'SSH key authorized successfully.'
          fi
